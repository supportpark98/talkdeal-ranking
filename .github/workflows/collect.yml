name: 톡딜 랭킹 수집

on:
  schedule:
    # 카카오는 정각 집계를 약 40분 뒤에 반영한다. 그래서 50분에 수집하고 다음 시 10분에 백업 수집한다.
    # 기본 수집: 한국 10:50, 18:50, 00:50 (UTC 01:50, 09:50, 15:50)
    - cron: "50 1,9,15 * * *"
    # 백업 수집: 한국 11:10, 19:10, 01:10 (UTC 02:10, 10:10, 16:10). 같은 집계가 이미 있으면 건너뜀
    - cron: "10 2,10,16 * * *"
    # 외부 cron(cron-job.org)도 같은 시각에 workflow_dispatch로 실행한다
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 랭킹 수집
        run: python scripts/collect.py --size 100 --out data --skip-if-saved
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 랭킹 수집"
          git pull --rebase origin main
          git push origin HEAD:main
