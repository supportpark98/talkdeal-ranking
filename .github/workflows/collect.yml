name: 톡딜 랭킹 수집

on:
  schedule:
    # 카카오는 정각 집계를 약 40분 뒤에 반영한다. 그래서 50분에 수집하고 다음 시 10분에 백업 수집한다.
    # 기본 수집: 한국 09:50, 16:50, 18:50, 23:50 (UTC 00:50, 07:50, 09:50, 14:50)
    #   16시, 23시는 16:59/23:59에 끝나는 딜의 마지막 데이터를 잡기 위함 (딜이 끝나면 랭킹에서 바로 빠짐)
    - cron: "50 0,7,9,14 * * *"
    # 백업 수집: 한국 10:10, 17:10, 19:10, 00:10 (UTC 01:10, 08:10, 10:10, 15:10). 같은 집계가 이미 있으면 건너뜀
    # 카카오 집계가 이상하면(진행 중인 상위 딜 대거 누락) 본 수집 안에서 5·10·15분 뒤 다시 받는다
    - cron: "10 1,8,10,15 * * *"
    # 외부 cron(cron-job.org)도 같은 시각에 workflow_dispatch로 실행한다
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 집계 이상 시 5·10·15분 뒤 재시도(최대 30분 대기)
    timeout-minutes: 50
    steps:
      # 실행이 대기했다가 시작돼도 최신 main(앞 실행이 저장한 데이터 포함)을 받아서 중복 저장을 막는다
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 랭킹 수집
        run: python scripts/collect.py --size 100 --out data --skip-if-saved
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 랭킹 수집"
          git pull --rebase origin main
          git push origin HEAD:main
