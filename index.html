<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>톡딜 유아동 랭킹</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --text:#1a1d23; --muted:#6b7280; --line:#e5e7eb;
  --accent:#fee500; --accent-ink:#3c1e1e; --up:#e5484d; --down:#2f6fde; --new:#12a150;
  --sel:#fffbe0;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#111316; --card:#1a1d22; --text:#e8eaed; --muted:#9aa0a6; --line:#2c3036; --sel:#2a2715; --down:#6d9cf0}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.45}
header{background:var(--accent);color:var(--accent-ink);padding:18px 16px}
header .wrap{display:flex;flex-wrap:wrap;align-items:end;gap:12px;justify-content:space-between}
h1{margin:0;font-size:20px;font-weight:800}
.sub{font-size:13px;opacity:.8;margin-top:2px}
.wrap{max-width:1180px;margin:0 auto}
main{padding:16px}
select,input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
header select{border-color:rgba(0,0,0,.15)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.tile .k{color:var(--muted);font-size:12px}
.tile .v{font-size:18px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .d{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 small{font-weight:400;color:var(--muted);font-size:12px}
.chartbox{position:relative;height:300px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.toolbar input{flex:1;min-width:160px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;cursor:pointer;user-select:none}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--bg)}
tbody tr.sel{background:var(--sel)}
.rank{font-weight:800;font-size:16px;width:36px;text-align:center}
.chg{font-size:12px;font-weight:700;white-space:nowrap;width:52px}
.up{color:var(--up)} .down{color:var(--down)} .new{color:var(--new)} .same{color:var(--muted)}
.thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--line);display:block}
.pname{max-width:420px}
.pname a{color:inherit;text-decoration:none;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pname a:hover{text-decoration:underline}
.pname .cat{font-size:12px;color:var(--muted)}
.disc{color:var(--up);font-weight:700}
.delta{font-size:11px;display:block}
.empty{padding:40px;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:12px;text-align:center;padding:8px 16px 24px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div>
      <h1>톡딜 출산/유아동 실시간 랭킹</h1>
      <div class="sub" id="basis">불러오는 중…</div>
    </div>
    <label>수집 시점 <select id="snap"></select></label>
  </div>
</header>
<main class="wrap">
  <section class="tiles" id="tiles"></section>

  <section class="card">
    <h2>순위 추이 <small>표에서 상품을 눌러 추가하거나 뺄 수 있어요 (최대 8개)</small></h2>
    <div class="chartbox"><canvas id="chart"></canvas></div>
  </section>

  <section class="card">
    <h2>랭킹 <small id="cmp"></small></h2>
    <div class="toolbar">
      <input id="q" type="search" placeholder="상품명, 브랜드 검색">
      <select id="filter">
        <option value="all">전체</option>
        <option value="up">순위 상승</option>
        <option value="down">순위 하락</option>
        <option value="new">신규 진입</option>
      </select>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th data-k="rank" class="num">순위</th><th data-k="chg">변동</th><th></th>
          <th data-k="name">상품명</th><th data-k="brand">브랜드</th>
          <th data-k="price" class="num">톡딜가</th><th data-k="discountRate" class="num">할인율</th>
          <th data-k="ordering" class="num">주문중</th>
        </tr></thead>
        <tbody id="rows"><tr><td colspan="8" class="empty">불러오는 중…</td></tr></tbody>
      </table>
    </div>
  </section>
</main>
<footer>매일 10시, 18시, 24시에 자동 수집 · 출처: 카카오 톡딜 랭킹</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const fmt = n => n == null ? '-' : n.toLocaleString('ko-KR');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLORS = ['#e5484d','#2f6fde','#12a150','#f5a524','#8e4ec6','#0ea5a4','#d6409f','#7c8a99'];
const state = {index:null, history:null, cur:null, prev:null, sort:{k:'rank',dir:1}, picked:[], chart:null};

function label(file){ // 20261108_1000.json -> 11/08 10:00
  const m = file.match(/(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})/);
  return m ? `${+m[2]}/${+m[3]} ${m[4]}:${m[5]}` : file;
}
function aggLabel(s){ // 20261108160000
  if(!s) return '';
  return `${s.slice(0,4)}.${s.slice(4,6)}.${s.slice(6,8)} ${s.slice(8,10)}시 기준`;
}
async function getJSON(p){ const r = await fetch(p, {cache:'no-cache'}); if(!r.ok) throw new Error(p+' '+r.status); return r.json(); }

async function init(){
  try{
    [state.index, state.history] = await Promise.all([getJSON('data/index.json'), getJSON('data/history.json')]);
  }catch(e){
    $('#rows').innerHTML = '<tr><td colspan="8" class="empty">아직 수집된 데이터가 없어요. 첫 수집 후에 표시됩니다.</td></tr>';
    $('#basis').textContent = '데이터 없음';
    return;
  }
  const files = state.index.snapshots;
  $('#snap').innerHTML = files.map((f,i)=>`<option value="${i}">${label(f)}</option>`).reverse().join('');
  $('#snap').value = files.length-1;
  $('#snap').onchange = () => load(+$('#snap').value);
  $('#q').oninput = render; $('#filter').onchange = render;
  document.querySelectorAll('th[data-k]').forEach(th => th.onclick = () => {
    const k = th.dataset.k; state.sort = {k, dir: state.sort.k===k ? -state.sort.dir : (k==='rank'||k==='name'||k==='brand'?1:-1)}; render();
  });
  await load(files.length-1, true);
}

async function load(i, first){
  const files = state.index.snapshots;
  state.cur = await getJSON('data/snapshots/'+files[i]);
  state.prev = i>0 ? await getJSON('data/snapshots/'+files[i-1]) : null;
  const prevMap = new Map((state.prev?.products||[]).map(p=>[p.productId,p]));
  state.cur.products.forEach(p => {
    const q = prevMap.get(p.productId);
    p.prevRank = q ? q.rank : null;
    p.chg = !state.prev ? 0 : q ? q.rank - p.rank : 999; // 999 = 신규
    p.dOrdering = q && p.ordering!=null && q.ordering!=null ? p.ordering - q.ordering : null;
  });
  $('#basis').textContent = `${aggLabel(state.cur.aggregatedAt)} · 상위 ${state.cur.products.length}개`;
  $('#cmp').textContent = state.prev ? `변동은 직전 수집(${label(files[i-1])}) 대비` : '비교할 이전 수집이 없어요';
  if(first) state.picked = state.cur.products.slice(0,5).map(p=>String(p.productId));
  tiles(); render(); drawChart();
}

function tiles(){
  const ps = state.cur.products, top = ps[0];
  const news = state.prev ? ps.filter(p=>p.chg===999) : [];
  const risers = ps.filter(p=>p.chg>0 && p.chg!==999).sort((a,b)=>b.chg-a.chg);
  const hot = ps.filter(p=>p.dOrdering!=null).sort((a,b)=>b.dOrdering-a.dOrdering)[0];
  const t = (k,v,d) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
  $('#tiles').innerHTML =
    t('현재 1위', esc(top.brand), esc(top.name)) +
    t('가장 많이 오른 상품', risers[0] ? `<span class="up">▲${risers[0].chg}</span> ${esc(risers[0].brand)}` : '-', risers[0] ? `${risers[0].prevRank}위 → ${risers[0].rank}위` : '직전 대비 상승 없음') +
    t('신규 진입', state.prev ? `${news.length}개` : '-', news.slice(0,3).map(p=>esc(p.brand)).join(', ') || ' ') +
    t('주문중 가장 많이 늘어난 상품', hot && hot.dOrdering>0 ? `+${fmt(hot.dOrdering)} ${esc(hot.brand)}` : '-', hot ? esc(hot.name) : ' ');
}

function chgHTML(p){
  if(!state.prev) return '<span class="same">-</span>';
  if(p.chg===999) return '<span class="new">NEW</span>';
  if(p.chg>0) return `<span class="up">▲${p.chg}</span>`;
  if(p.chg<0) return `<span class="down">▼${-p.chg}</span>`;
  return '<span class="same">–</span>';
}

function render(){
  const q = $('#q').value.trim().toLowerCase(), f = $('#filter').value;
  let ps = state.cur.products.filter(p => !q || (p.name+' '+p.brand).toLowerCase().includes(q));
  if(f==='up') ps = ps.filter(p=>p.chg>0 && p.chg!==999);
  if(f==='down') ps = ps.filter(p=>p.chg<0);
  if(f==='new') ps = ps.filter(p=>p.chg===999);
  const {k,dir} = state.sort;
  ps = [...ps].sort((a,b)=>{ const x=a[k], y=b[k]; if(x==null) return 1; if(y==null) return -1; return (typeof x==='string' ? x.localeCompare(y,'ko') : x-y)*dir; });
  $('#rows').innerHTML = ps.length ? ps.map(p => `
    <tr data-id="${p.productId}" class="${state.picked.includes(String(p.productId))?'sel':''}">
      <td class="rank">${p.rank}</td>
      <td class="chg">${chgHTML(p)}</td>
      <td><img class="thumb" loading="lazy" src="${esc(p.image)}" alt=""></td>
      <td class="pname"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a><div class="cat">${esc(p.category)}</div></td>
      <td>${esc(p.brand)}</td>
      <td class="num">${fmt(p.price)}원</td>
      <td class="num disc">${p.discountRate ? Math.round(p.discountRate)+'%' : '-'}</td>
      <td class="num">${fmt(p.ordering)}${p.dOrdering ? `<span class="delta ${p.dOrdering>0?'up':'down'}">${p.dOrdering>0?'+':''}${fmt(p.dOrdering)}</span>`:''}</td>
    </tr>`).join('') : '<tr><td colspan="8" class="empty">조건에 맞는 상품이 없어요</td></tr>';
  document.querySelectorAll('#rows tr[data-id]').forEach(tr => tr.onclick = e => {
    if(e.target.closest('a')) return;
    const id = tr.dataset.id, i = state.picked.indexOf(id);
    if(i>=0) state.picked.splice(i,1); else { if(state.picked.length>=8) state.picked.shift(); state.picked.push(id); }
    render(); drawChart();
  });
}

function drawChart(){
  const h = state.history, labels = h.files.map(label);
  const datasets = state.picked.filter(id=>h.products[id]).map((id,i)=>({
    label: `${h.products[id].brand} · ${h.products[id].name.slice(0,18)}`,
    data: h.products[id].ranks, borderColor: COLORS[i%COLORS.length], backgroundColor: COLORS[i%COLORS.length],
    spanGaps:false, tension:0, pointRadius:3, borderWidth:2
  }));
  const dark = matchMedia('(prefers-color-scheme: dark)').matches, grid = dark ? '#2c3036' : '#eceef1', tick = dark ? '#9aa0a6' : '#6b7280';
  const cfg = {type:'line', data:{labels, datasets}, options:{
    responsive:true, maintainAspectRatio:false, interaction:{mode:'nearest',intersect:false},
    scales:{ y:{reverse:true, min:1, suggestedMax:20, title:{display:true,text:'순위',color:tick}, ticks:{precision:0,color:tick}, grid:{color:grid}},
             x:{ticks:{color:tick, maxRotation:0, autoSkip:true}, grid:{display:false}} },
    plugins:{ legend:{position:'bottom', labels:{color:tick, boxWidth:10, font:{size:11}}},
              tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${c.raw==null?'순위권 밖':c.raw+'위'}`}} }
  }};
  if(state.chart) state.chart.destroy();
  state.chart = new Chart($('#chart'), cfg);
}
init();
</script>
</body>
</html>
