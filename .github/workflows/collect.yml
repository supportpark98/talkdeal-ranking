name: 톡딜 랭킹 수집

on:
  schedule:
    # 한국 시간 10시, 18시, 24시 (UTC 01, 09, 15시)
    - cron: "0 1,9,15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 랭킹 수집
        run: python scripts/collect.py --size 100 --out data
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 랭킹 수집"
          git pull --rebase origin main
          git push origin HEAD:main
